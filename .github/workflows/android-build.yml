name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create keystore from secrets
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          # key.properties names storeFile=upload-keystore.jks, which
          # build.gradle resolves against android/ - so the keystore has to land
          # there, not in android/app/.
          #
          # Fail loudly instead of quietly building a debug-signed bundle: Play
          # rejects those, and the step used to pass green while doing nothing.
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE / KEY_PROPERTIES secrets are missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > android/upload-keystore.jks
          echo "$KEY_PROPERTIES"   | base64 -d > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Build AAB for Play Store
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Build artifacts summary
        run: |
          echo "✅ Build complete!"
          echo "📦 APK: build/app/outputs/flutter-apk/app-release.apk"
          echo "📦 AAB: build/app/outputs/bundle/release/app-release.aab"
          echo ""
          echo "To upload to Play Store:"
          echo "1. Go to https://play.google.com/console"
          echo "2. Upload app-release.aab to Internal Testing track"
          echo "3. Test thoroughly"
          echo "4. Promote to Production when ready"
